plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
        signingConfigs {
        ver_debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
        ver_release {
            def storeFilePath = project.findProperty("RELEASE_STORE_FILE") ?: System.getenv("RELEASE_STORE_FILE")
            if (storeFilePath && file(storeFilePath).exists()) {
                storeFile file(storeFilePath)
                storePassword project.findProperty("RELEASE_STORE_PASSWORD") ?: System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias project.findProperty("RELEASE_KEY_ALIAS") ?: System.getenv("RELEASE_KEY_ALIAS")
                keyPassword project.findProperty("RELEASE_KEY_PASSWORD") ?: System.getenv("RELEASE_KEY_PASSWORD")
            }
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    flavorDimensions "version"

    productFlavors {
        ver_debug {
            dimension "version"
            // versionNameSuffix "-ver_debug"
            signingConfig signingConfigs.ver_debug

            buildConfigField("boolean", "IS_DEBUG", "true")
            buildConfigField("String", "FLAVOR_NAME", "\"ver_debug\"")

            firebaseCrashlytics {
                mappingFileUploadEnabled false
                nativeSymbolUploadEnabled false
            }
        }

        ver_release {
            dimension "version"
            signingConfig signingConfigs.ver_release

            buildConfigField("boolean", "IS_DEBUG", "false")
            buildConfigField("String", "FLAVOR_NAME", "\"ver_release\"")

            firebaseCrashlytics {
                mappingFileUploadEnabled false
                nativeSymbolUploadEnabled false
            }
        }
    }

    aaptOptions {
        cruncherEnabled = false
    }

    buildFeatures {
        buildConfig = true
    }

    compileSdk 34
    namespace 'com.glory.game'

    defaultConfig {
        applicationId 'com.gloryrp.app'
        minSdk 26
        targetSdk 34
        versionCode 113
        versionName "GLORYRP"

        multiDexEnabled true

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    packagingOptions {
        jniLibs {
            excludes += ['META-INF/*']
        }
        resources {
            excludes += ['META-INF/*']
        }
        pickFirst 'META-INF/LICENSE.txt'
        pickFirst 'META-INF/NOTICE.txt'
        pickFirst 'META-INF/DEPENDENCIES'
    }

    configurations {
        all {
            exclude group: 'com.android.support', module: 'support-compat'
            exclude group: 'com.android.support', module: 'support-core-ui'
            exclude group: 'com.android.support', module: 'support-core-utils'
            exclude group: 'com.android.support', module: 'support-fragment'
            exclude group: 'com.android.support', module: 'support-annotations'
            exclude group: 'com.android.support', module: 'support-v4'
            exclude group: 'com.android.support', module: 'appcompat-v7'
            exclude group: 'com.android.support', module: 'design'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def buildType = variant.buildType.name
            outputFileName = "mobile-game-${buildType}.apk"
        }
    }

    ndkVersion '26.2.11394342'

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.ver_release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            crunchPngs false
        }
        release {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.ver_release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            crunchPngs false
        }
        diag {
            initWith release
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.ver_release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            crunchPngs false
            ndk {
                debugSymbolLevel 'FULL'
            }
            externalNativeBuild {
                cmake {
                    cppFlags "-DENABLE_RENDER_DIAGNOSTICS=1 -DDIAG_BUILD=1"
                }
            }
        }
        all {
            multiDexEnabled true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    aaptOptions {
        cruncherEnabled = false
    }

    buildFeatures {
        prefab true
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation "com.google.android.material:material:1.9.0"
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment:2.7.4'
    implementation 'androidx.navigation:navigation-ui:2.7.4'
    implementation "androidx.recyclerview:recyclerview:1.3.2"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'com.github.amitshekhariitbhu:PRDownloader:1.0.2'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.intuit.sdp:sdp-android:1.1.0'

    implementation 'androidx.annotation:annotation:1.7.0'

    implementation 'com.google.firebase:firebase-analytics:21.5.0'
    implementation 'com.google.firebase:firebase-crashlytics:18.6.0'
    implementation platform('com.google.firebase:firebase-bom:32.6.0')
    implementation 'com.google.firebase:firebase-messaging:23.3.1'

    implementation 'org.ini4j:ini4j:0.5.4'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    implementation "androidx.lifecycle:lifecycle-process:2.6.2"

    implementation "com.joom.paranoid:paranoid-gradle-plugin:0.3.14"
    implementation 'com.bytedance.android:shadowhook:1.0.9'
    implementation 'com.airbnb.android:lottie:6.1.0'
    implementation 'com.github.Dimezis:BlurView:version-2.0.3'
    implementation 'com.tuyenmonkey:mkloader:1.4.0'

    implementation 'androidx.multidex:multidex:2.0.1'
    ////////////////////////////////////////////////
    implementation 'com.akexorcist:round-corner-progress-bar:2.1.2'
    implementation 'com.github.hzy3774:AndroidP7zip:v1.7.2'
    implementation 'com.liulishuo.filedownloader:library:1.7.7'
    implementation 'com.github.GrenderG:Toasty:1.5.2'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'pub.devrel:easypermissions:3.0.0'
    implementation 'com.mikhaellopez:circularprogressbar:3.1.0'
    implementation 'com.balysv:material-ripple:1.0.2'
    implementation 'com.github.Triggertrap:SeekArc:v1.1'
}



tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('copySymbols') {
    doLast {
        def symDir = file("${project.rootDir}/symbols/${android.defaultConfig.versionCode}")
        def abis = ['arm64-v8a', 'armeabi-v7a']
        abis.each { abi ->
            def targetDir = file("${symDir}/${abi}")
            targetDir.mkdirs()
            fileTree(dir: "${buildDir}/intermediates/cxx", include: "**/${abi}/libmultiplayer.so").each { f ->
                if (f.exists()) {
                    copy {
                        from f
                        into targetDir
                    }
                }
            }
        }
        println "Symbols copied to ${symDir}"
    }
}
